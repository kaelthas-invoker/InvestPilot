name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --python 3.12

      - name: Ruff lint
        run: uv run --python 3.12 ruff check .

      - name: Pytest with coverage
        run: uv run --python 3.12 pytest --cov=investpilot --cov-report=xml --cov-fail-under=20